controller_manager:
  ros__parameters:
    update_rate: 500  # Hz (1:1 synchronized with Gazebo 0.002s physics step)

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_group_position_controller:
      type: position_controllers/JointGroupPositionController

joint_group_position_controller:
  ros__parameters:
    joints:
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint

gazebo_ros2_control:
  ros__parameters:
    pid_gains:
      position:
        FL_hip_joint: {kp: 40.0, ki: 0.0, kd: 0.3}
        FL_thigh_joint: {kp: 40.0, ki: 0.0, kd: 0.3}
        FL_calf_joint: {kp: 40.0, ki: 0.0, kd: 0.3}
        FR_hip_joint: {kp: 40.0, ki: 0.0, kd: 0.3}
        FR_thigh_joint: {kp: 40.0, ki: 0.0, kd: 0.3}
        FR_calf_joint: {kp: 40.0, ki: 0.0, kd: 0.3}
        RL_hip_joint: {kp: 40.0, ki: 0.0, kd: 0.3}
        RL_thigh_joint: {kp: 40.0, ki: 0.0, kd: 0.3}
        RL_calf_joint: {kp: 40.0, ki: 0.0, kd: 0.3}
        RR_hip_joint: {kp: 40.0, ki: 0.0, kd: 0.3}
        RR_thigh_joint: {kp: 40.0, ki: 0.0, kd: 0.3}
        RR_calf_joint: {kp: 40.0, ki: 0.0, kd: 0.3}
